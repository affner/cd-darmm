spring:
  datasource:
    url: jdbc:sqlite:cwdarmm.db
    driver-class-name: org.sqlite.JDBC
  banner:
    location: banner.txt
  main:
    banner-mode: console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

    # Aquí solamente el FQCN, sin citas ni espacios adicionales:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
